---
layout: default
---
<div class="archive-header">
    <h1 class="archive-title">{{ page.title }}</h1>
    <p class="archive-meta">{{ site.tags | size }} tags</p>
</div>

<div class="tag-jump">
    {% assign sorted = site.tags | sort %}
    {% for tag in sorted %}
    <a class="badge badge-primary" href="{{ site.baseurl }}/tags/{{ tag[0] | slugify }}/">{{ tag[0] }} <span>{{ tag[1] | size }}</span></a>
    {% endfor %}
</div>
